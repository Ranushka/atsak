services:
  atsak:
    build: .
    image: atsak:latest
    container_name: atsak
    restart: unless-stopped
    ports:
      - "3800:3800"
    environment:
      - NODE_ENV=production
      - PORT=3800
    volumes:
      - atsak-data:/app/data

volumes:
  atsak-data:
    external: true
    name: repo_atsak-data
